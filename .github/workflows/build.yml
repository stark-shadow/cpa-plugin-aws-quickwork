name: Build plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: macos-14, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: windows-2025, os: windows, arch: amd64 }
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Select the Windows runner's native MinGW-w64 GCC
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $gcc = 'C:/mingw64/bin/gcc.exe'
          if (-not (Test-Path -LiteralPath $gcc -PathType Leaf)) {
            throw "Expected the hosted image's MinGW-w64 GCC at $gcc"
          }
          $target = & $gcc -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $target -ne 'x86_64-w64-mingw32') {
            throw "Unexpected MinGW-w64 target: $target"
          }
          "CC=$gcc" >> $env:GITHUB_ENV
      - name: Assert native Go target and compiler
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          go version
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          target="$(go env GOOS)/$(go env GOARCH)"
          expected="$EXPECTED_OS/$EXPECTED_ARCH"
          echo "Go host=$host, target=$target, expected=$expected"
          test "$host" = "$expected"
          test "$target" = "$expected"
          cc="$(go env CC)"
          if [[ "$EXPECTED_OS" == windows ]]; then
            cc="$(cygpath -u "$cc")"
          fi
          "$cc" --version
      - name: Build ZIP, check checksum and test CPA installation
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          ./build.sh
          archive=$(python .github/release_assets.py stage dist artifact "$EXPECTED_OS/$EXPECTED_ARCH")
          QUICKWORK_INSTALL_ARCHIVE="$archive" go test -count=1 -v ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-quickwork-build-${{ matrix.os }}-${{ matrix.arch }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release-assets:
    name: Collect verified release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aws-quickwork-build-*
          path: downloads
          merge-multiple: false
      - name: Verify the expected ZIPs and combine sorted checksums
        run: python .github/release_assets.py merge downloads release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-quickwork-release-assets
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
